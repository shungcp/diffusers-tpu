[project]
name = "diffusers-tpu"
version = "0.1.0"
description = "MiniMax-H3 and Qwen-Image-2.1 on Cloud TPU: JAX, torchax and torch_tpu backends"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
# Backend-specific, pinned environments live in requirements/*.txt.
dependencies = ["diffusers", "transformers>=5.17", "huggingface-hub", "numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["diffusers_tpu*"]

[tool.setuptools.package-data]
"diffusers_tpu.models.minimax_h3" = ["*.json"]
